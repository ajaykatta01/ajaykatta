<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('ak-theme');document.documentElement.dataset.theme=(t==='light'||t==='dark')?t:'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<title>UI/UX Case Studies — Ajay Katta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail" data-bg-color="#1C1A14">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1C1A14"/>
    <rect x="450" y="280" width="300" height="240" rx="24" fill="none" stroke="#FF6B5C" stroke-width="14"/>
    <rect x="510" y="340" width="180" height="36" rx="8" fill="#E85949"/>
    <rect x="510" y="404" width="120" height="36" rx="8" fill="#E85949"/>
  </svg>
</template>
<style>
:root{
  --bg:#0B0D12; --surface:#14171E; --line:#2A313D;
  --text:#F4F6FA; --muted:#B2BAC7; --accent:#FF6B5C; --accent-2:#FF8F82; --glow:color-mix(in srgb, #FF6B5C 40%, transparent);
}
[data-theme="light"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --line:#DDE1E8;
  --text:#11141A; --muted:#49515F; --accent:#FF6B5C; --accent-2:#E85949; --glow:color-mix(in srgb, #FF6B5C 24%, transparent);
}
.theme-toggle{width:54px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;transition:background .4s;flex:none}
.theme-toggle .knob{position:absolute;top:2.5px;left:3px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent));transition:transform .4s cubic-bezier(.2,.7,.3,1);display:flex;align-items:center;justify-content:center;font-size:11px}
[data-theme="light"] .theme-toggle .knob{transform:translateX(26px)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-div{width:1px;height:22px;background:var(--line);flex:none}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;overflow-x:hidden;min-height:100vh}
::selection{background:var(--accent);color:#fff}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;line-height:1.1}
.mono{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 55% at 18% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%)}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.7,.3,1)}
header.nav-hidden{transform:translateY(-100%)}
.nav{display:flex;align-items:center;justify-content:space-between;height:50px}
.back{display:inline-flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;font-family:'Space Grotesk';font-weight:600;font-size:.92rem;transition:color .25s}
.back .arr{transition:transform .3s}
.back:hover{color:var(--accent)}
.back:hover .arr{transform:translateX(-4px)}
.home{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:600;font-size:.92rem;color:var(--text);text-decoration:none;transition:color .25s}
.home .hicon{display:inline-flex;width:17px;height:17px;color:var(--accent);transition:transform .3s}
.home:hover{color:var(--accent)}
.home:hover .hicon{transform:translateY(-2px)}

/* hero (index) */
.phead{padding:84px 0 54px;text-align:center}
.phead h1{font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.03em;margin:16px 0 18px}
.phead p{color:var(--muted);max-width:560px;font-size:1.02rem;margin-left:auto;margin-right:auto}

/* tiles — unified project card (shared style across all project pages) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;padding-bottom:110px;max-width:1100px;margin:0 auto}
.ptile{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);min-height:360px;
  display:flex;flex-direction:column;cursor:pointer;text-decoration:none;color:var(--text);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .35s,box-shadow .35s}
.ptile:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 22px 50px -26px var(--glow)}
.ptile-img{position:relative;height:200px;flex:none;display:flex;align-items:flex-end;padding:14px;overflow:hidden;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 78%, var(--surface)), color-mix(in srgb,var(--accent-2) 70%, var(--surface))),
    repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 1px, transparent 1px 14px);
  transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.ptile:hover .ptile-img{transform:scale(1.05)}
.ph-label{font-family:'Space Mono';font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  background:color-mix(in srgb,var(--bg) 58%,transparent);backdrop-filter:blur(4px);padding:5px 10px;border-radius:6px;border:1px solid color-mix(in srgb,#fff 12%,transparent)}
.ptile-body{padding:24px 26px;display:flex;flex-direction:column;flex:1}
.ptile-tag{font-family:'Space Mono';font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);margin-bottom:10px}
.ptile h3{font-size:1.3rem;margin-bottom:16px;line-height:1.25}
.ptile-link{font-family:'Space Grotesk';font-weight:600;font-size:.85rem;color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-top:auto}
.ptile-link .arr{transition:transform .3s}
.ptile:hover .arr{transform:translateX(5px)}

/* reveal */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease var(--d,0s),transform .7s cubic-bezier(.2,.7,.3,1) var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none}}

/* ===== tabbed detail view ===== */
.cs-detail{display:none}
body.detail .theme-toggle,body.detail .home,body.detail .ak-wrap{display:none}
body.detail .index-view{display:none}
body.detail .cs-detail{display:block}
.cs-bar{position:sticky;top:50px;z-index:40;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),opacity .35s}
.cs-bar.bar-hidden{transform:translateY(calc(-100% - 50px));opacity:0;pointer-events:none}
.cs-bar-inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 28px;max-width:1180px;margin:0 auto}
.cs-back{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:600;font-size:.88rem;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;transition:.25s}
.cs-back:hover{border-color:var(--accent);color:var(--accent)}
.cs-back .arr{transition:transform .3s}
.cs-back:hover .arr{transform:translateX(-4px)}
.tabbar{display:inline-flex;gap:5px;padding:5px;border:1px solid var(--line);border-radius:99px;
  background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(8px);overflow-x:auto;max-width:100%}
.tab{font-family:'Space Grotesk';font-weight:600;font-size:.88rem;color:var(--muted);padding:7px 16px;border-radius:99px;border:none;background:none;cursor:pointer;transition:.3s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.panel{display:none}
.panel.active{display:block}

/* ===== animated hero (tab) ===== */
.hero{position:relative;overflow:hidden;min-height:62vh;display:flex;align-items:center;border-bottom:1px solid var(--line);
  --h-c1:var(--accent);--h-c2:var(--accent-2);--h-c3:var(--accent)}
.hero-cover{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease;
  mask:radial-gradient(82% 82% at 50% 38%,#000,transparent 86%);-webkit-mask:radial-gradient(82% 82% at 50% 38%,#000,transparent 86%)}
.hero-cover.on{opacity:.16}
.hero::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(78% 80% at 50% 44%, color-mix(in srgb,var(--bg) 52%,transparent) 0%, color-mix(in srgb,var(--bg) 92%,transparent) 100%)}
[data-theme="light"] .hero-cover.on{opacity:.1}
[data-theme="light"] .ptile,
[data-theme="light"] .ovcard,
[data-theme="light"] .meta{box-shadow:0 14px 34px -18px rgba(17,20,26,.35),0 2px 6px rgba(17,20,26,.08)}
[data-theme="light"] .ptile:hover,
[data-theme="light"] .ovcard:hover{box-shadow:0 26px 60px -30px rgba(17,20,26,.35),0 22px 50px -26px var(--glow)}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero-grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;mask:radial-gradient(72% 62% at 50% 42%,#000,transparent 80%);-webkit-mask:radial-gradient(72% 62% at 50% 42%,#000,transparent 80%);
  animation:gridpan 26s linear infinite}
@keyframes gridpan{to{background-position:56px 56px}}
.hero-blobs{position:absolute;inset:-12%;z-index:0;pointer-events:none;filter:blur(64px)}
.blob{position:absolute;border-radius:50%;opacity:.5;mix-blend-mode:screen}
[data-theme="light"] .blob{mix-blend-mode:multiply;opacity:.3}
.b1{width:46vw;height:46vw;left:-6vw;top:-12vw;background:radial-gradient(circle at 30% 30%,var(--h-c1),transparent 64%);animation:drift1 19s ease-in-out infinite}
.b2{width:40vw;height:40vw;right:-8vw;top:2vw;background:radial-gradient(circle at 60% 40%,var(--h-c2),transparent 64%);animation:drift2 23s ease-in-out infinite}
.b3{width:34vw;height:34vw;left:32vw;bottom:-18vw;background:radial-gradient(circle at 50% 50%,var(--h-c3),transparent 66%);animation:drift3 27s ease-in-out infinite}
.panel[data-panel="fintrack"] .hero{--h-c3:#E85949}
.panel[data-panel="checkout"] .hero{--h-c3:#FF6B5C}
.panel[data-panel="analytics"] .hero{--h-c3:#E85949}
@keyframes drift1{50%{transform:translate(8vw,6vh) scale(1.12)}}
@keyframes drift2{50%{transform:translate(-7vw,8vh) scale(1.08)}}
@keyframes drift3{50%{transform:translate(5vw,-7vh) scale(1.15)}}
.hero-inner{position:relative;z-index:2;padding:46px 28px;width:100%;max-width:1180px;margin:0 auto;text-align:center}
.panel.active .hero-inner>*{opacity:0;transform:translateY(24px);animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards}
.panel.active .hero-eyebrow{animation-delay:.08s}.panel.active .hero-title{animation-delay:.20s}.panel.active .hero-desc{animation-delay:.32s}.panel.active .hero-meta{animation-delay:.44s}.panel.active .hero-actions{animation-delay:.56s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.panel.active .hero-inner>*{opacity:1;transform:none;animation:none}.hero-grid,.blob{animation:none}}
.hero-eyebrow{display:inline-block;margin-bottom:18px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(8px)}
.hero-title{font-size:clamp(2.2rem,5.4vw,4rem);letter-spacing:-.035em;max-width:15ch;margin:0 auto 20px;
  background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 52%,var(--h-accent,var(--accent))));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-desc{color:var(--muted);max-width:580px;font-size:clamp(1rem,1.4vw,1.16rem);margin:0 auto 34px}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin-bottom:36px}
.meta{display:flex;flex-direction:column;gap:5px;padding:13px 17px;border:1px solid var(--line);border-radius:14px;
  background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(10px);min-width:124px}
.mk{font-family:'Space Mono';font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2)}
.mv{font-family:'Space Grotesk';font-weight:600;font-size:.94rem}
.hero-scroll{display:inline-flex;align-items:center;gap:11px;font-family:'Space Grotesk';font-weight:600;color:var(--text);background:none;border:none;cursor:pointer;font-size:.9rem}
.hero-scroll .dn{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.cover-up{display:inline-flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:600;font-size:.84rem;color:var(--muted);
  border:1px dashed var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;transition:.25s}
.cover-up:hover{color:var(--text);border-color:var(--accent)}
.cover-up svg{width:15px;height:15px;flex:none}

/* ===== gallery (fintrack) ===== */
.gallery{display:flex;flex-direction:column;gap:30px;padding:48px 0;background:#f5f5f5;clip-path:inset(0 -100vmax);box-shadow:0 0 0 100vmax #f5f5f5;
  width:min(1600px,93vw);margin-left:50%;transform:translateX(-50%)}
.shot{position:relative;border-radius:0;overflow:hidden;background:#f5f5f5}
.shot .cap{position:absolute;top:14px;left:14px;z-index:2;font-family:'Space Mono';font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;background:color-mix(in srgb,#0b0b12 62%,transparent);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;border:1px solid color-mix(in srgb,#fff 14%,transparent)}
.shot img{display:block;width:100%;height:auto}

/* ===== overview ===== */
.ov{padding:60px 0 80px}
.ov .mono{display:block;margin-bottom:14px}
.ov h2{font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.02em;margin-bottom:18px}
.ov .lead{color:var(--muted);max-width:700px;font-size:1.05rem;margin-bottom:46px}
.ovgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ovcard{border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--surface);
  transition:transform .45s cubic-bezier(.2,.7,.3,1),border-color .4s,box-shadow .4s}
.ovcard:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 26px 64px -34px var(--glow)}
.ovcard .num{font-family:'Space Mono';color:var(--accent-2);font-size:.7rem;letter-spacing:.16em}
.ovcard h3{font-size:1.16rem;margin:12px 0 10px}
.ovcard p{color:var(--muted);font-size:.95rem}
.foot{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 0 90px}
.cs-foot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:74px 0 100px}
.cs-foot .mono{display:block}
.cs-foot h2{font-size:clamp(1.8rem,3.2vw,2.6rem);letter-spacing:-.02em}
.cs-foot .credit{color:var(--muted);font-size:.88rem}
.totop{margin-top:18px;display:inline-flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:600;font-size:.9rem;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:11px 22px;cursor:pointer;transition:.25s}
.totop:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.totop span{display:inline-flex;transition:transform .3s}
.totop:hover span{transform:translateY(-3px)}

/* ===== figma prototype embed ===== */
.proto{padding:56px 0 6px}
.proto .mono{display:block;margin-bottom:14px}
.proto h2{font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.02em;margin-bottom:14px;color:var(--text)}
.proto .lead{color:var(--muted);max-width:680px;font-size:1.05rem;margin-bottom:20px}
.proto-hint{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.proto-hint .chip{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono';font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 13px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.proto-hint .chip b{color:var(--accent-2);font-weight:700}
.proto-hint .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.proto-frame{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);
  width:100%;max-width:1240px;height:min(82vh,820px);margin:0 auto;box-shadow:0 26px 64px -34px var(--glow)}
.proto-frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
/* prototype embeds always sit on a black stage (built-in + admin-added) */
.cs-detail .ak-wide iframe.media,.ak-detail .ak-wide iframe.media{background:#000}
.proto-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 6%,transparent) 0 1.5px,transparent 1.5px 17px)}
.proto-empty .pico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--accent)}
.proto-empty .pico svg{width:18px;height:18px}
.proto-empty p{color:var(--muted);font-size:.95rem;max-width:400px}
.proto-btn{font-family:'Space Grotesk';font-weight:600;font-size:.86rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:99px;padding:11px 20px;cursor:pointer;transition:.25s}
.proto-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.proto-tools{display:flex;justify-content:flex-end;margin-top:14px}
.proto-edit{font-family:'Space Grotesk';font-weight:600;font-size:.84rem;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 18px;cursor:pointer;transition:.25s}
.proto-edit:hover{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
/* prototype stage always reads as a dark zone (info text + frame), even in light theme */
[data-theme="light"] .proto{
  --bg:#0B0D12;--surface:#14171E;--line:#2A313D;
  --text:#F4F6FA;--muted:#B2BAC7;--accent:#FF6B5C;--accent-2:#FF8F82;
  --glow:color-mix(in srgb,#FF6B5C 40%,transparent);
  background:#0B0D12;border:1px solid #2A313D;border-radius:20px;
  padding:44px 34px 34px;margin-bottom:46px}

/* animated motion removed — static color hero */
.hero-canvas{display:none}
.hero-grid{animation:none}
.blob{animation:none}
.b1{transform:translate(4vw,3vh) scale(1.06)}
.b2{transform:translate(-3vw,4vh) scale(1.04)}
.b3{transform:translate(2vw,-3vh) scale(1.06)}
@media (max-width:760px){.ovgrid{grid-template-columns:1fr}.hero-inner{padding:46px 28px}}
@media (max-width:720px){.ptile-body{padding:22px}.shot .cap{font-size:.56rem;padding:5px 9px}}
@media (max-width:760px){
  .container{padding:0 20px}
  .phead{padding:60px 0 40px}
  .pgrid{grid-template-columns:1fr;gap:20px;padding-bottom:72px}
  .cs-bar-inner{padding:8px 16px;gap:10px;flex-wrap:nowrap;justify-content:flex-start}
  .cs-bar .cs-back{flex:0 0 auto;padding:7px 13px;font-size:.84rem}
  .cs-bar .tabbar{flex:1 1 auto;min-width:0;justify-content:flex-start}
  .hero-inner{padding:40px 20px}
  .hero-meta{gap:10px}
  .meta{min-width:calc(50% - 7px);flex:1}
  .ov{padding:44px 0 60px}
  .proto-frame{height:min(72vh,600px)}
}
@media (max-width:440px){
  .back .bk-rest{display:none}
  .nav-right{gap:12px}
}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="back" href="index.html#work"><span class="arr">&larr;</span> Back<span class="bk-rest"> to projects</span></a>
    <div class="nav-right"><a class="home" href="index.html#top"><span class="hicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11.2 12 4l9 7.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 9.6V20h13V9.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span> <span class="hm-lbl">Home</span></a><span class="nav-div" aria-hidden="true"></span><button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode"><span class="knob" id="knob">🌙</span></button></div>
  </div>
</header>

<!-- ===== INDEX (grid) ===== -->
<div class="index-view">
  <section class="container phead">
    <span class="mono">UI / UX · Product Design</span>
    <h1>UI/UX Case Studies</h1>
    <p>Selected product design work across mobile and web — from research and flows to shipped interface. Click any project to open it in a tab.</p>
  </section>

  <section class="container">
    <div class="pgrid">
      <!-- Project cards are rendered here by admin.js from portfolio-data.json -->
    </div>
  </section>
</div>

<script>
const root=document.documentElement, knob=document.getElementById('knob');

/* hide header on scroll down, reveal on scroll up */
(function(){
  const head=document.querySelector('header');
  let last=window.scrollY||document.documentElement.scrollTop;
  let ticking=false;
  function update(){
    const y=window.scrollY||document.documentElement.scrollTop;
    if(y>last && y>120){ head.classList.add('nav-hidden'); }
    else{ head.classList.remove('nav-hidden'); }
    last=y; ticking=false;
  }
  addEventListener('scroll',()=>{ if(!ticking){requestAnimationFrame(update);ticking=true;} },{passive:true});
})();

/* theme glyph on load — theme is applied early in <head>; toggling + ripple handled by
   theme-ripple.js, shared across pages via localStorage 'ak-theme' */
(function(){ try{ const saved=localStorage.getItem('ak-theme'); if(saved){ root.dataset.theme=saved; } }catch(e){} knob.textContent=root.dataset.theme==='light'?'☀️':'🌙'; })();
</script>
<script>window.AK_ADMIN={page:'ui-ux',noun:'case study',gridSelector:'.index-view .pgrid',tileTag:'article'};</script>
<script src="admin.js?v=2"></script>
<script src="theme-ripple.js"></script>
</body>
</html>
