<style>
:root{
  --bg:#0A0A0A; --bg-soft:#06080C; --surface:#14171E; --line:#2A313D;
  --text:#F4F6FA; --muted:#B2BAC7; --accent:#FF6B5C; --accent-2:#FF8F82; --accent-ink:#FF6B5C; --accent-ink-2:#FF8F82; --glow:rgba(255,107,92,.40);

}
[data-theme="light"]{
  --bg:#FFFFFF; --bg-soft:#F1F3F6; --surface:#FFFFFF; --line:#DDE1E8;
  --text:#11141A; --muted:#49515F; --accent:#FF6B5C; --accent-2:#C2410C; --accent-ink:#C2410C; --accent-ink-2:#9A3412; --glow:rgba(255,107,92,.24);

}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; line-height:1.6;
  transition:background .5s ease,color .5s ease; overflow-x:hidden;
  min-height:100vh; min-height:100svh; display:flex; flex-direction:column;
}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent-ink);text-decoration:none}
a:hover{color:var(--accent-ink-2)}
:where(a,button,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink)}

/* ---------- header (same as résumé) ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--header-bg);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:10px;position:relative}
.logo:hover{color:var(--text)}
.logo .orb{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent-2),var(--accent));box-shadow:0 0 14px var(--glow);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.nav-right{display:flex;align-items:center;gap:22px}
.nav-right a{color:var(--muted);font-size:.86rem;font-weight:500}
.nav-right a:hover{color:var(--text)}
/* theme toggle — pendant lamp + pull chain (lamp on = light mode); pull / swing / flicker in theme-ripple.js */
.theme-toggle{--lamp-on:#F5B83D;width:22px;height:34px;padding:0;border:0;border-radius:8px;background:none;cursor:pointer;position:relative;flex:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.theme-toggle::after{content:'';position:absolute;left:-11px;right:-11px;top:50%;height:44px;transform:translateY(-50%)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-toggle .lamp{position:absolute;inset:0;transform-origin:50% -15px;pointer-events:none}
.theme-toggle .lamp::before{content:'';position:absolute;left:50%;top:-15px;width:1px;height:17px;margin-left:-.5px;background:var(--muted);opacity:.7}
.theme-toggle .lamp-shade{position:absolute;left:50%;top:2px;width:15px;height:7.5px;margin-left:-7.5px;border-radius:8px 8px 1.5px 1.5px;background:var(--text);z-index:2}
.theme-toggle .knob{position:absolute;left:50%;top:7.5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;font-size:0;color:transparent;text-indent:-99px;overflow:hidden;background:color-mix(in srgb,var(--muted) 45%,var(--bg));transform:none;box-shadow:none;transition:background .3s,box-shadow .3s;z-index:1}
[data-theme="light"] .theme-toggle .knob{transform:none;background:#FFD66B;box-shadow:0 0 4px 1px rgba(255,196,64,.75),0 0 11px 3px rgba(255,196,64,.3)}
.theme-toggle .lamp-rays{position:absolute;left:50%;top:10.5px;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:repeating-conic-gradient(from 31.5deg,var(--lamp-on) 0 9deg,transparent 9deg 36deg);-webkit-mask:radial-gradient(circle,transparent 0 6px,#000 6.4px 9.4px,transparent 9.8px);mask:radial-gradient(circle,transparent 0 6px,#000 6.4px 9.4px,transparent 9.8px);clip-path:inset(45% 0 0 0);opacity:0;transform:scale(.6);transition:opacity .3s,transform .45s cubic-bezier(.2,1.4,.4,1)}
[data-theme="light"] .theme-toggle .lamp-rays{opacity:1;transform:scale(1)}
.theme-toggle .lamp-chain{position:absolute;left:50%;top:14.5px;width:2px;height:12px;margin-left:-1px;background:radial-gradient(circle,var(--muted) .7px,transparent 1px) 0 0/2px 3px repeat-y;transition:transform .25s}
.theme-toggle .lamp-chain::after{content:'';position:absolute;left:50%;top:100%;width:6px;height:6px;margin-left:-3px;box-sizing:border-box;border:1.2px solid var(--muted);border-radius:50%;transition:border-color .25s}
.theme-toggle:hover .lamp-chain{transform:translateY(1.5px)}
.theme-toggle:hover .lamp-chain::after,.theme-toggle:focus-visible .lamp-chain::after{border-color:var(--accent-ink,var(--accent))}
@media (prefers-reduced-motion:reduce){.theme-toggle .knob,.theme-toggle .lamp-rays,.theme-toggle .lamp-chain{transition:none}}

/* ---------- 404 ---------- */
main{flex:1;display:grid;place-items:center;padding:56px 24px 72px;background:var(--card-grad)}

.code .zero::after{content:'';position:absolute;left:50%;top:50%;width:.1em;height:.1em;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 35%,var(--accent-2),var(--accent));box-shadow:0 0 .18em var(--glow);animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

.btn-primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#06070D;box-shadow:0 0 24px var(--glow)}

.btn-ghost{border:1px solid var(--line);color:var(--text);background:transparent}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px)}
.btn svg{width:16px;height:16px}
.work{margin-top:44px;width:100%;border-top:1px solid var(--line);padding-top:24px}
.work .lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.work ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.work a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--text);font-size:.88rem;font-weight:500;transition:border-color .25s,transform .25s}
.work a:hover{color:var(--text);border-color:var(--tc);transform:translateY(-2px)}
.work a i{width:8px;height:8px;border-radius:50%;background:var(--tc);box-shadow:0 0 10px var(--tc);flex:none}
footer{padding:22px 24px 28px;text-align:center;font-size:.78rem;color:var(--muted)}

@media (pointer:coarse),(max-width:900px){

@media (max-width:560px){

  .lost .mono{margin-top:26px}
  .cta{flex-direction:column;align-items:stretch;width:100%;max-width:320px}

}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
